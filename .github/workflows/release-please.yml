name: Release Please

on:
  push:
    branches:
      - main
    # Only code changes can trigger a release; docs-only pushes are ignored.
    # package.json, manifest.json and .release-please-manifest.json must stay
    # listed: they change when the release PR is merged, which creates the release.
    paths:
      - "main.ts"
      - "styles.css"
      - "esbuild.config.mjs"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - "manifest.json"
      - ".release-please-manifest.json"
  # Manual run from the Actions tab; the paths filter does not apply here.
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    # Never run with write permissions from a non-default branch (manual dispatch).
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  # Build without any write permission: dependency install scripts run here.
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "18.x"

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-assets
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error

  # Minimal job holding the write token: only uploads the built files.
  upload:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plugin-assets

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if ! [[ "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected tag name: $TAG_NAME" >&2
            exit 1
          fi
          gh release upload "$TAG_NAME" main.js manifest.json styles.css
